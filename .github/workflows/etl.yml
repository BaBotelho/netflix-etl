name: ETL Netflix

on:
  schedule:
    - cron: '0 6 * * *'  # Executa diariamente às 06:00 UTC (~03:00 BRT)
  workflow_dispatch:     # Permite executar manualmente pelo GitHub

jobs:
  run-etl:
    runs-on: ubuntu-latest

    env:
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_BABOTELHO }}
      KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}

    steps:
      - name: Checkout do código
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'  # Compatível com pandas 1.21.x e outras libs

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar pipeline ETL
        run: python etl_flow.py

      - name: Commit do banco de dados atualizado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/netflix.db
          git commit -m "Update DB via CI" || echo "No changes"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
