name: Run ETL Pipeline

on:
  push:  # Executa quando fizer push para o repositório
    branches:
      - main

jobs:
  run-etl:
    runs-on: ubuntu-latest  # Usa uma máquina Linux na nuvem

    steps:
      - name: Checkout do código
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'  # Altere conforme sua versão

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Configurar API do Kaggle
        run: |
          mkdir -p ~/.kaggle
          echo "{\"username\":\"${{ secrets.KAGGLE_BABOTELHO }}\",\"key\":\"${{ secrets.KAGGLE_KEY }}\"}" > ~/.kaggle/kaggle.json
          chmod 600 ~/.kaggle/kaggle.json

      - name: Executar pipeline ETL
        run: python etl_flow.py
